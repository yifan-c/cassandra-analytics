  #######################
  ## Develop Pipelines ##
  #######################

  - name: cassandra-analytics-core-2.11-jdk8
    branchName: apple
    build:
      template: buildozer:v4:build
    trigger:
      gitPush: true
    timeout: 40
    machine:
      env:
        <<: *machineEnv
        RUNTIME_JDK_VERSION: "applejdk-8"
        ORG_GRADLE_PROJECT_scala: "2.11"
        SPARK_VERSION: "2"
        JDK_VERSION: "1.8"
        CODE_VERSION: $(./code_version.sh)
        skipCheck: true
    package:
      release: false
      libraries:
        - publish:
            - repo: m2:oss-patched
    reports:
      junit: true
    finally:
      radar:
        annotate: true

