schemaVersion: '2.0'
timeout: 30

radar:
  componentNames:
    - ACI Cassandra Analytics

machine:
  env: &machineEnv
    RUNTIME_JDK_VERSION: 11
  # TODO: Do we still need the OEL 7 compatible image here?
  # baseImage: docker.apple.com/base-images/oel7-isg/java11-builder:latest

pipelines:
  #######################
  ##   PRB Pipelines   ##
  #######################

  - name: prb-cassandra-analytics-core-spark2-2.11-jdk8
    branchName: apple
    build:
      template: buildozer:v4:prb
    machine:
      env:
        RUNTIME_JDK_VERSION: "applejdk-8"
        SPARK_VERSION: "2"
        ORG_GRADLE_PROJECT_scala: "2.11"
        JDK_VERSION: "1.8"
    reports:
      junit: true
    jenkins:
      concurrentBuild: true
      maxConcurrentTotal: 16

  - name: prb-cassandra-analytics-core-spark2-2.11-jdk11
    branchName: apple
    build:
      template: buildozer:v4:prb
    machine:
      env:
        <<: *machineEnv
        SPARK_VERSION: "2"
